name: Sync README from CHANGELOG

# CHANGELOG.md가 바뀐 push에서만 돈다 — 새 버전을 릴리스할 때만 CHANGELOG.md를
# 고치므로, 사실상 "새 버전이 올라갈 때"만 실행된다. 이 워크플로가 만드는 커밋은
# README.md만 건드리고 CHANGELOG.md는 건드리지 않으므로, 그 커밋이 다시 이
# 워크플로를 무한히 재실행시키지 않는다.
on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]

permissions:
  contents: write

jobs:
  sync-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: node scripts/sync-readme-changelog.js

      - run: |
          if git diff --quiet -- README.md; then
            echo "README.md가 이미 최신입니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: README를 CHANGELOG.md 최신 항목으로 동기화"
          git push
